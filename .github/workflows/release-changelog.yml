name: Release changelog

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  changelog:
    name: Release changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release notes and versions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base_ref="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -n "$base_ref" ] && [ "$base_ref" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check-changelog.py --base-ref "$base_ref"
          else
            python3 scripts/check-changelog.py
          fi
      - name: Test the release-note validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
